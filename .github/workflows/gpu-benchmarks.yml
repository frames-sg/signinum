name: GPU benchmarks

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Accelerator to benchmark"
        type: choice
        required: true
        options: [cuda, metal]
      suite:
        description: "Benchmark workload"
        type: choice
        required: true
        default: smoke
        options: [smoke, criterion, profile, adoption, routing]
      baseline-ref:
        description: "Immutable baseline revision for Criterion comparisons"
        type: string
        required: true
        default: "29143c8e1f00bbbe9cf5ab37b3cea882f6d52139"
      profile-mode:
        description: "Criterion/profile sampling mode"
        type: choice
        required: true
        default: quick
        options: [quick, release]

permissions:
  contents: read

concurrency:
  group: gpu-benchmark-${{ inputs.lane }}
  cancel-in-progress: false

jobs:
  run:
    name: Benchmarks
    uses: frames-sg/j2k/.github/workflows/gpu-benchmarks-runner.yml@7307750c0e4ea4af071258a63962b0bfccf7973d
    with:
      lane: ${{ inputs.lane }}
      suite: ${{ inputs.suite }}
      baseline-ref: ${{ inputs.baseline-ref }}
      profile-mode: ${{ inputs.profile-mode }}
