name: GPU validation

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Accelerator lane to validate"
        type: choice
        required: true
        default: cuda
        options: [cuda, metal, all]
      mode:
        description: "Quick validates selected lanes; full is release-grade and requires all"
        type: choice
        required: true
        default: quick
        options: [quick, full]
      coverage-base-ref:
        description: "Git revision used as the changed-line coverage base in full mode"
        type: string
        required: false
        default: "v0.6.2"

permissions:
  contents: read

concurrency:
  group: gpu-validation-${{ github.sha }}-${{ inputs.target }}-${{ inputs.mode }}
  cancel-in-progress: ${{ inputs.mode == 'quick' }}

jobs:
  run:
    name: GPU
    uses: frames-sg/j2k/.github/workflows/gpu-validation-runner.yml@7307750c0e4ea4af071258a63962b0bfccf7973d
    with:
      target: ${{ inputs.target }}
      mode: ${{ inputs.mode }}
      coverage-base-ref: ${{ inputs.coverage-base-ref }}
