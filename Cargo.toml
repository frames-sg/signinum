[workspace]
resolver = "2"
members = [
    "crates/j2k",
    "crates/j2k-alloc-probe",
    "crates/j2k-codec-math",
    "crates/j2k-core",
    "crates/j2k-compare",
    "crates/j2k-cuda",
    "crates/j2k-cuda-build-support",
    "crates/j2k-cuda-j2k-engine",
    "crates/j2k-cuda-jpeg-engine",
    "crates/j2k-cuda-runtime",
    "crates/j2k-cuda-transcode-engine",
    "crates/j2k-jpeg",
    "crates/j2k-jpeg-cuda",
    "crates/j2k-jpeg-metal",
    "crates/j2k-metal",
    "crates/j2k-metal-support",
    "crates/j2k-mpsgraph",
    "crates/j2k-mpsgraph-support",
    "crates/j2k-ml",
    "crates/j2k-native",
    "crates/j2k-profile",
    "crates/j2k-test-support",
    "crates/j2k-t803",
    "crates/j2k-tilecodec",
    "crates/j2k-transcode",
    "crates/j2k-transcode-cuda",
    "crates/j2k-transcode-metal",
    "crates/j2k-transcode-test-support",
    "crates/j2k-types",
    "crates/j2k-cli",
    "xtask",
]
[workspace.package]
version = "0.11.1"
edition      = "2021"
rust-version = "1.96"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/frames-sg/j2k"
homepage     = "https://frames-sg.github.io/j2k/rust-jpeg2000-codec/"
keywords     = ["jpeg", "jpeg2000", "htj2k", "gpu", "transcode"]
categories   = ["multimedia::images", "multimedia::encoding", "compression"]

[workspace.dependencies]
thiserror = { version = "2", default-features = false }
proptest  = { version = "1" }
criterion = { version = "0.8", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
tar = "0.4"
zstd = { version = "0.13" }
weezl = { version = "0.1.12" }
libloading = "0.9"
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSError",
    "NSRange",
    "NSString",
    "NSURL",
] }
objc2-metal = { version = "=0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCaptureManager",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLEvent",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }
objc2-metal-performance-shaders = { version = "=0.3.2", default-features = false, features = [
    "MPSCore",
    "MPSCoreTypes",
    "MPSNDArray",
] }
objc2-metal-performance-shaders-graph = { version = "=0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-metal-performance-shaders",
    "MPSGraph",
    "MPSGraphArithmeticOps",
    "MPSGraphCore",
    "MPSGraphMemoryOps",
    "MPSGraphOperation",
    "MPSGraphReductionOps",
    "MPSGraphTensor",
    "MPSGraphTensorData",
    "MPSGraphTensorShapeOps",
] }
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
rayon  = "1"
cc     = "1.2"
libc   = "0.2"
log    = "0.4"
memchr = { version = "2.8", default-features = false }
image = { version = "0.25.8", default-features = false, features = ["bmp", "jpeg", "png", "pnm", "tiff"] }
moxcms = { version = "=0.8.1", default-features = false }
jpeg-encoder = "0.7.0"
jpeg-decoder = { version = "0.3.2", default-features = false }
zune-core = "0.5.1"
zune-jpeg = "0.5.15"
fearless_simd = "0.7"
libm = { version = "0.2", default-features = false }
openjpeg-sys = "1.0.12"
proc-macro2 = "1.0.106"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10.9"
syn = "2.0.117"
toml = "1.1.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib"] }
burn-core = { version = "0.21.0", default-features = false, features = ["dataset", "std"] }
burn-autodiff = { version = "0.21.0", default-features = false, features = ["std"] }
burn-flex = { version = "0.21.0", default-features = false, features = ["std"] }
burn-ndarray = { version = "0.21.0", default-features = false, features = ["std"] }
burn-wgpu = { version = "0.21.0", default-features = false, features = ["fusion", "metal", "std"] }
burn-cuda = { version = "0.21.0", default-features = false, features = ["fusion", "std"] }
burn-cubecl = { version = "0.21.0", default-features = false, features = ["fusion", "std"] }
burn-fusion = { version = "0.21.0", default-features = false, features = ["std"] }
burn-ir = { version = "0.21.0", default-features = false, features = ["std"] }

# Shared strict-lint policy for safe crates. Crates with genuinely different
# needs (SIMD/FFI crates that use `unsafe`, crates with documented temporary
# allow lists) keep their own [lints] tables until later cleanup phases
# narrow them.
[workspace.lints.rust]
unsafe_code            = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub        = "warn"

[workspace.lints.clippy]
pedantic                = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto           = "fat"
codegen-units = 1
strip         = "symbols"
opt-level     = 3

[profile.release-bench]
inherits  = "release"
debug     = true
strip     = "none"

[profile.gpu-quick]
inherits      = "release"
lto           = false
codegen-units = 16
