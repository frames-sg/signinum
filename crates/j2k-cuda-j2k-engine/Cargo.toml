[package]
name = "j2k-cuda-j2k-engine"
description = "CUDA JPEG 2000 and HTJ2K codec engine for J2K adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["Cargo.toml", "README.md", "benches/**", "build.rs", "src/**"]

[package.metadata.docs.rs]
all-features = true
targets = []

[package.metadata.cargo-machete]
# CUDA-Oxide project staging is invoked from build.rs.
ignored = ["j2k-cuda-build-support"]

[lib]
name = "j2k_cuda_j2k_engine"
path = "src/lib.rs"

[features]
default = []
cuda-profiling = ["j2k-cuda-runtime/cuda-profiling"]
cuda-oxide-j2k-encode = []
cuda-oxide-j2k-decode-store = []
cuda-oxide-j2k-classic-decode = []
cuda-oxide-j2k-dequantize = []
cuda-oxide-j2k-idwt = []
cuda-oxide-j2k-ml = []
cuda-oxide-htj2k-decode = []
cuda-oxide-htj2k-encode = []

[dependencies]
j2k-codec-math = { path = "../j2k-codec-math", version = "=0.11.1" }
j2k-core = { path = "../j2k-core", version = "=0.11.1" }
j2k-cuda-runtime = { path = "../j2k-cuda-runtime", version = "=0.11.1" }
j2k-types = { path = "../j2k-types", version = "=0.11.1" }

[build-dependencies]
j2k-cuda-build-support = { path = "../j2k-cuda-build-support", version = "=0.11.1" }

[dev-dependencies]
criterion = { workspace = true }
j2k-test-support = { path = "../j2k-test-support" }
sha2 = { workspace = true }

[[bench]]
name = "idwt_wide"
harness = false
test = false
required-features = ["cuda-oxide-j2k-idwt"]

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"
