[package]
name = "j2k-cuda-jpeg-engine"
description = "CUDA baseline JPEG codec engine for J2K adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["Cargo.toml", "README.md", "build.rs", "src/**"]

[package.metadata.docs.rs]
all-features = true
targets = []

[package.metadata.cargo-machete]
# CUDA-Oxide project staging is invoked from build.rs.
ignored = ["j2k-cuda-build-support"]

[lib]
name = "j2k_cuda_jpeg_engine"
path = "src/lib.rs"

[features]
default = []
cuda-profiling = ["j2k-cuda-runtime/cuda-profiling"]
cuda-oxide-jpeg-decode = []
cuda-oxide-jpeg-encode = []

[dependencies]
j2k-codec-math = { path = "../j2k-codec-math", version = "=0.11.0" }
j2k-core = { path = "../j2k-core", version = "=0.11.0" }
j2k-cuda-runtime = { path = "../j2k-cuda-runtime", version = "=0.11.0" }

[build-dependencies]
j2k-codec-math = { path = "../j2k-codec-math", version = "=0.11.0" }
j2k-cuda-build-support = { path = "../j2k-cuda-build-support", version = "=0.11.0" }

[dev-dependencies]
j2k-test-support = { path = "../j2k-test-support" }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"
