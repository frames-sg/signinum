[package]
name = "j2k-cuda-runtime"
description = "CUDA codec engine and Driver API runtime for j2k device adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["Cargo.toml", "README.md", "build.rs", "src/**"]

[package.metadata.docs.rs]
all-features = true
targets = []

[package.metadata.cargo-machete]
# Build-time metadata and CUDA-Oxide staging dependencies used through build.rs.
ignored = ["j2k-codec-math", "j2k-cuda-build-support"]

[lib]
name = "j2k_cuda_runtime"
path = "src/lib.rs"

[features]
default = []
cuda-profiling = []
cuda-oxide = [
    "cuda-oxide-copy-u8",
]
cuda-oxide-copy-u8 = []

[dependencies]
j2k-core = { path = "../j2k-core", version = "=0.11.0" }
libloading = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
j2k-codec-math = { path = "../j2k-codec-math", version = "=0.11.0" }
j2k-cuda-build-support = { path = "../j2k-cuda-build-support", version = "=0.11.0" }

[dev-dependencies]
j2k-test-support = { path = "../j2k-test-support" }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
# Public API annotation/documentation policy remains a separate release review.
must_use_candidate = "allow"
missing_errors_doc = "allow"
