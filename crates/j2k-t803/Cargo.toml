[package]
name = "j2k-t803"
description = "Unpublished ISO/IEC 15444-4 conformance support for the j2k workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
runner = [
    "dep:image",
    "dep:j2k",
    "dep:j2k-codec-math",
    "dep:j2k-compare",
    "dep:j2k-core",
    "dep:j2k-native",
    "dep:zip",
]
cuda-runner = [
    "runner",
    "dep:j2k-cuda",
    "dep:j2k-cuda-runtime",
    "j2k-cuda/cuda-runtime",
]
metal-runner = ["runner", "dep:j2k-metal", "dep:objc2-metal"]

[dependencies]
image = { workspace = true, optional = true }
j2k = { path = "../j2k", version = "=0.11.0", optional = true }
j2k-codec-math = { path = "../j2k-codec-math", version = "=0.11.0", optional = true }
j2k-compare = { path = "../j2k-compare", version = "=0.2.0", optional = true }
j2k-core = { path = "../j2k-core", version = "=0.11.0", optional = true }
j2k-native = { path = "../j2k-native", version = "=0.11.0", optional = true }
j2k-cuda = { path = "../j2k-cuda", version = "=0.11.0", optional = true }
j2k-cuda-runtime = { path = "../j2k-cuda-runtime", version = "=0.11.0", optional = true }
j2k-metal = { path = "../j2k-metal", version = "=0.11.0", optional = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
zip = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { workspace = true, optional = true }

[dev-dependencies]
j2k-test-support = { path = "../j2k-test-support" }

[lints]
workspace = true

[[bin]]
name = "j2k-t803-runner"
path = "src/bin/j2k-t803-runner.rs"
required-features = ["runner"]
